# The full suite runs against the sandbox with the CI project's credentials.
# It is scheduled rather than tied to pull requests: it has failed on every
# run since May 2026 (blocked workspace, runner IP not allowed) and a red
# check that no change can turn green tells a reviewer nothing.

name: Sandbox suite

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  SANDBOX_CENTER_ID: ${{ secrets.SANDBOX_CENTER_ID }}
  SANDBOX_ID: ${{ secrets.SANDBOX_ID }}
  SANDBOX_ORGANIZATION_ID: ${{ secrets.SANDBOX_ORGANIZATION_ID }}
  SANDBOX_ORGANIZATION_PRIVATE_KEY: ${{ secrets.SANDBOX_ORGANIZATION_PRIVATE_KEY }}
  SANDBOX_PRIVATE_KEY: ${{ secrets.SANDBOX_PRIVATE_KEY }}

jobs:
  sandbox:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Test with pytest
      run: |
        pytest
